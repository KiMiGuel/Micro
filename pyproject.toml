[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microvault"
version = "0.1.0"
description = "A local, offline, encrypted CLI vault for API keys."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=41.0",
    "colorama>=0.4",
    "questionary>=2.0",
]
authors = [
    { name = "MicroVault contributors" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Security :: Cryptography",
]

[project.scripts]
microvault = "microvault:main"

[tool.setuptools]
py-modules = ["microvault"]
